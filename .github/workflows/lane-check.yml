# Reusable formatting, lint, and typecheck lane for maxi-tools Rust CI.
name: CI lane / check

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
      advisory:
        required: false
        type: boolean
        default: false
      checkout_submodules:
        required: false
        type: boolean
        default: false
      skip_swift_build:
        description: Skip repository Swift build scripts in Rust-only lanes.
        required: false
        type: boolean
        default: false
      allow_unwrap_used:
        required: false
        type: boolean
        default: false
      repo_policy:
        # Consumer repository policy profile. `standard-rust` (the default) runs
        # every step; `fork-upstream` skips the house-style-only checks
        # (`Check formatting`, `Lint workspace`) because the bulk of the tree
        # is upstream code we don't own and rebase onto. See
        # docs/contracts/fork-lane-policy.md for the full rule.
        required: false
        type: string
        default: standard-rust

      scope:
        description: >-
          lane-plan's classification of the change: `full`, or
          `merge-gate-only` when every changed path is documentation or
          metadata. The lane skips itself on `merge-gate-only` -- see the
          `if:` on the job for why the skip lives here and not on the caller.
        required: false
        type: string
        default: full
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions: {}

# Callers set CARGO_NET_GIT_FETCH_WITH_CLI at their workflow level, but env
# does not cross the reusable-workflow boundary: without it here, cargo
# fetches git deps with libgit2, which cannot use the app-token insteadOf
# rewrite, and private git deps (e.g. maxi-libs) fail to authenticate.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_TERM_COLOR: always
  # Pin the target dir to the job workspace so a runner-level CARGO_TARGET_DIR
  # (e.g. a shared farm cache in the runner service .env) can never redirect
  # build output or make concurrent jobs serialize on one build-dir flock,
  # where the cpu-liveness guard kills the lock-waiter at 0% CPU. Policy
  # (hooks/cargo-cache-policy.sh in maxi-core): cross-run reuse belongs in
  # sccache; Cargo target dirs stay workspace-local and disposable.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  MAXI_ALLOW_UNWRAP_USED: ${{ inputs.allow_unwrap_used }}
  MAXI_TRAY_SKIP_SWIFT_BUILD: ${{ inputs.skip_swift_build && '1' || '' }}

jobs:
  lane-check:
    # Skipped for Dependabot, and skipped HERE rather than at the caller.
    #
    # This lane needs the app token to fetch maxi-config's Rust policy itself
    # (scripts/select-rust-toolchain.sh, hooks/clippy-strict-lints.sh) over the
    # private Contents API, and a Dependabot-triggered run gets the DEPENDABOT
    # secrets scope, which this org has never populated. Unlike lane-plan --
    # which needs the token only to READ a routing policy and so can fall back
    # to that lane's declared native runners -- there is no honest fallback
    # here: without its policy this lane cannot enforce the deny tier it exists
    # for, and "the gate passed on input it could not judge" is the failure
    # this org keeps getting burned by.
    #
    # WHY THE GUARD IS ON THIS JOB AND NOT ON THE CALLER, which is the whole
    # point and was got wrong first: skipping the CALLER's job skips the
    # reusable workflow, so the nested check run is never created at all. On a
    # skipped caller GitHub publishes `merge-gate / check` and nothing else --
    # `merge-gate / check / lane-check` is ABSENT, not skipped. That context is
    # REQUIRED by maxi-config, voicemaci, maxi-ui, maxi-libs and ~20 more repos
    # (`gh api repos/<r>/rulesets`), and an absent required context is not
    # "pending until it runs", it is a PR that can never merge. Guarding the
    # job inside the reusable workflow keeps the check run present with
    # conclusion `skipped`, which required-status-check evaluation accepts.
    #
    # Keyed on `github.actor`: GitHub keys the secrets restriction on the
    # actor, so a human pushing to a dependabot/* branch has ordinary secrets
    # and this lane runs for real. Same spelling as maxi-core's ci.yml guards.
    #
    # The durable fix is org-level DEPENDABOT secrets for APP_ID /
    # APP_PRIVATE_KEY, which would make this guard inert rather than wrong.
    #
    # THE SAME RULE COVERS THE OTHER TWO SKIPS. A docs-only change
    # (`inputs.scope == 'merge-gate-only'`, classified by lane-plan) and a
    # maxi-config fan-out PR (branch prefix AND distributor id, both halves,
    # per maxi-config ci/fanout-identity.toml) do not need this lane either.
    # Measured 2026-09-19: one distribute run touched 48 consumer PRs; with
    # all 35 runners busy the resulting queue stalled unrelated work for 15+
    # minutes, and nothing reclaims it -- `timeout-minutes` bounds EXECUTION,
    # not queue time. A fan-out PR carries a byte-for-byte copy of a payload
    # already tested on the canon, so building it in every consumer
    # re-derives one answer ~48 times. A head ref is chosen by whoever
    # pushes the branch, so the prefix alone would let anyone skip CI by
    # naming a branch; the numeric id is the half that cannot be claimed.
    # ci#20 and ci#10 put those skips on the CALLER's `check`/`test` jobs,
    # which is the placement this comment warns against: under the fleet's
    # rulesets (44 repos require `merge-gate / check / lane-check` and
    # `merge-gate / test / lane-test` by name, measured 2026-09-20) a skipped
    # caller leaves those contexts ABSENT and the PR can never merge. The
    # pin fan-out would have shipped that to every consumer on its next
    # advance. Here, the check run exists with conclusion `skipped`, which
    # satisfies a required-status-check rule, and `merge-gate`'s aggregate
    # step treats `skipped` as fine.
    #
    # The fan-out half tests `github.event_name` explicitly rather than
    # leaning on a null `pull_request` object coercing to false on push and
    # workflow_dispatch. The `github` context inside a reusable workflow is
    # the caller's, so the same predicate works here unchanged.
    if: >-
      github.actor != 'dependabot[bot]' &&
      inputs.scope != 'merge-gate-only' &&
      !(github.event_name == 'pull_request' &&
        startsWith(github.event.pull_request.head.ref, 'maxi-config-sync/') &&
        github.event.pull_request.user.id == 264883562)
    runs-on: ${{ (startsWith(inputs.runs_on, '[') || startsWith(inputs.runs_on, '"')) && fromJSON(inputs.runs_on) || inputs.runs_on }}
    continue-on-error: ${{ inputs.advisory }}
    # Backstop against a wedged job holding a runner for GitHub's 6h default.
    # Observed healthy lane-check runs are 0.1-2.5 min; 45 is ~18x the p95 and
    # will not trip a legitimate build, but caps a hang at 45 min instead of 6h.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        # Checkout is where jobs actually wedge: git has no default stall
        # timeout, so a dead HTTPS fetch parks `git remote-https` at 0% CPU
        # forever. Two runners were held 33min and 2h04m this way on
        # 2026-07-31, and neither stall-guard nor cpu-liveness wraps this step.
        # A shallow clone takes seconds; 10 minutes is pure headroom.
        timeout-minutes: 10
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules && 'recursive' || 'false' }}

      # Repos with native system-library deps (e.g. alsa-sys behind a midi
      # feature) declare them in ci/apt-packages.txt — one package per line,
      # '#' comments allowed. Absent file means no extra packages.
      - name: Install repo-declared system packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          list="ci/apt-packages.txt"
          [ -f "$list" ] || exit 0
          packages="$(sed -e 's/#.*//' -e 's/[[:space:]]*$//' "$list" | xargs)"
          [ -n "$packages" ] || exit 0

          # Not every self-hosted Linux runner is Debian-family with a sudoer
          # build user. The NixOS ml-node boxes that now serve `linux-x64` have
          # neither apt-get nor sudo — they get system libraries from the
          # machine's Nix configuration — so hard-coding `sudo apt-get` failed
          # every lane at provisioning with `sudo: command not found`, three
          # seconds in, before compiling anything.
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::notice::No apt-get on this runner; expecting its image to provide: $packages"
            exit 0
          fi

          # Root needs no sudo, and a non-root user without it cannot install.
          # Saying so beats failing the lane over packages the image may
          # already have.
          elevate=()
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "::warning::Cannot install system packages (not root, no sudo); expecting this runner's image to provide: $packages"
              exit 0
            fi
            elevate=(sudo)
          fi

          "${elevate[@]}" apt-get update
          # shellcheck disable=SC2086
          "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $packages

      - name: Generate org repo token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          # Deliberately still app-id. Not an oversight -- see maxi-config#527.
          #
          # This is a `workflow_call` workflow: it only sees secrets its CALLER
          # passes, and `.github/workflows/rust-ci.yml` declares `APP_ID` explicitly
          # rather than using `secrets: inherit`. Its own caller is the vendored
          # `ci.yml` wrapper in ~38 consumer repos, pinned at
          # `maxi-tools/maxi-config/.github/workflows/rust-ci.yml@main`. Flipping
          # this to `client-id: ${{ secrets.APP_CLIENT_ID }}` takes effect on
          # every one of those repos the moment this file lands on main, while
          # their wrappers still forward only `APP_ID` -- an empty client-id and
          # a failing token step fleet-wide. The org secret existing does not
          # help; a called workflow cannot read a secret nobody handed it.
          #
          # Order of operations: thread `APP_CLIENT_ID` through the wrapper
          # template first, let maxi-config-sync deliver it (maxi-core#3881),
          # then flip these five call sites.
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: maxi-tools
          # Scoped to what this token is actually USED for, which is two reads:
          # the maxi-config policy fetch below (fetch-policy issues
          # GET /repos/maxi-tools/maxi-config/contents/...) and the private-
          # dependency `insteadOf` rewrite that lets cargo clone maxi-tools
          # crates. Neither writes anything.
          #
          # Without a permission-* input the mint inherits the WHOLE
          # installation, and this installation is repository_selection=all over
          # the org: contents/workflows/actions write on every repo plus
          # organization_self_hosted_runners write. That is org-wide write --
          # including the power to rewrite workflows and deregister the runners
          # themselves -- handed to a lane that only reads files, in ~38
          # consumer repos on every push. See maxi-config#581.
          #
          # `repositories:` is deliberately NOT added: this file fans out by
          # reference to consumer repos with different private-dependency sets,
          # and a list derived from one of them leaves the rest fetching
          # uncredentialed (maxi-config#557).
          permission-contents: read

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy

      - name: Fetch maxi-config rust-lane policy
        # One implementation, in .github/actions/fetch-policy. This block
        # existed in four near-identical copies until #462, which is how #460
        # fixed a live bug in a file nothing runs. Its reasoning -- the
        # partial-clone hangs, why plain HTTP GETs, why a non-empty body is
        # the success condition -- moved into the action unchanged, along with
        # why that action is referenced by its full owner/repo path.
        uses: maxi-tools/maxi-config/.github/actions/fetch-policy@main
        with:
          policy-files: |
            scripts/select-rust-toolchain.sh
            scripts/emit-runner-paths.sh
            hooks/clippy-strict-lints.sh
          token: ${{ steps.app-token.outputs.token }}
      - name: Expose installed macOS native build tools
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: bash .maxi-config/scripts/emit-runner-paths.sh /opt/homebrew/bin /usr/local/bin
      - name: Verify installed Rust toolchain before cache restore
        shell: bash
        run: bash .maxi-config/scripts/select-rust-toolchain.sh before-cache
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          prefix-key: v1-rust-no-bin
          cache-bin: false

      - name: Verify installed Rust toolchain after cache restore
        shell: bash
        run: bash .maxi-config/scripts/select-rust-toolchain.sh after-cache
      - name: Configure git for private deps
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Persistent runners can retain this job-owned directory after a
          # cancellation or host loss. Remove it before writing the new token
          # so an expired equal-length insteadOf rewrite cannot win.
          rm -rf "$RUNNER_TEMP/rust-lane"
          umask 077
          mkdir -p "$RUNNER_TEMP/rust-lane"
          gitconfig="$RUNNER_TEMP/rust-lane/.gitconfig-ci"
          cat > "$gitconfig" <<GITEOF
          [url "https://x-access-token:${GH_APP_TOKEN}@github.com/maxi-tools/"]
            insteadOf = https://github.com/maxi-tools/
            insteadOf = git@github.com:maxi-tools/
            insteadOf = ssh://git@github.com/maxi-tools/
          [http]
            lowSpeedLimit = 1000
            lowSpeedTime = 300
          GITEOF
          # Abort a fetch that has stalled rather than hanging forever. git has
          # no default stall timeout, so a dead HTTPS connection leaves
          # `git remote-https` parked at 0% CPU indefinitely — two runners were
          # held that way for 33min and 2h04m on 2026-07-31, and neither
          # stall-guard nor cpu-liveness wraps the checkout step. 1KB/s over 5
          # minutes is far below any healthy transfer, including cold submodule
          # fetches, so this only fires on a genuinely dead connection.
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/rust-lane/.gitconfig-ci" >> "$GITHUB_ENV"
      - name: Fetch private dependencies
        run: |
          if [ -f Cargo.lock ]; then
            cargo fetch --locked
          else
            cargo fetch
          fi

      - name: Remove private dependency auth
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/rust-lane"
          # Point at an empty real file, not /dev/null: later steps (e.g. the
          # clippy-policy checkout) run `git config --global`, and git cannot
          # take a lock on /dev/null ("could not lock config file").
          # This is a sibling under the runner-provided $RUNNER_TEMP, not a
          # child of the rust-lane directory removed above.
          (umask 077 && : > "$RUNNER_TEMP/gitconfig-empty")
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig-empty" >> "$GITHUB_ENV"

      - name: lane-check summary
        run: |
          {
            echo "## lane-check summary"
            echo "- Lane: lane-check"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check formatting
        # House-style check (maxi's rustfmt.toml + the fork's own rustfmt.toml
        # against upstream code). Forks of upstream projects skip it: see
        # docs/contracts/fork-lane-policy.md. Skipped, not deleted, so the
        # check run is reported as `skipped` and the ruleset's required-
        # status-check evaluation accepts it as present.
        if: ${{ inputs.repo_policy != 'fork-upstream' }}
        run: cargo fmt --all -- --check

      - name: Lint workspace
        # Same as `Check formatting`: applies maxi's strict clippy deny tier
        # (clippy-strict-lints.sh) to upstream code we don't own. Skipped for
        # `fork-upstream` for the same reason; kept for every other profile.
        if: ${{ inputs.repo_policy != 'fork-upstream' }}
        shell: bash
        run: |
          set -euo pipefail
          source .maxi-config/hooks/clippy-strict-lints.sh
          echo "Deny-tier flags:"
          get_clippy_deny_flags
          # Two passes, because the panic-safety denial belongs to shipping
          # code and the lane had no way to say so.
          #
          # maxi-config's clippy.toml states the policy outright -- "unwrap()/
          # expect()/panic!() are legitimate in test code -- a failed assertion
          # *should* abort the test. Keep the panic-safety lints focused on
          # shipping code." -- and encodes it as `allow-unwrap-in-tests = true`.
          # That config is necessary but not sufficient. Clippy suppresses the
          # lint only inside items it recognises as tests: a `#[test]`-attributed
          # fn, or anything under `#[cfg(test)]`. A plain helper fn in
          # tests/foo.rs, or a closure handed to tokio::spawn inside one, is an
          # ordinary item in a crate that merely happens to be built with
          # --test, so the lint fires there and the config never sees it.
          #
          # A single --all-targets pass therefore denied unwrap in exactly the
          # harness code the policy intends to allow. Ten repos carried
          # `allow_unwrap_used: true` to get past it; when a fan-out replaced
          # their wrapper with the canonical template that input was dropped,
          # and six went red at once on this lane. The override was load-bearing
          # for a policy bug -- which is why removing it broke them, and why
          # restoring it would only rearm the same trap.
          #
          # So: every target gets the full deny tier minus the unwrap rule, and
          # lib/bins then get the tier intact. The trailing -A wins over the
          # earlier -D on the same lint, and the second pass is a subset of the
          # first rather than a repeat of it.
          #
          # Cost is one extra clippy invocation. The flag sets differ, so the
          # second pass re-lints lib and bins rather than reusing the first
          # pass's fingerprint; it does not rebuild dependencies, and it never
          # touches the test, bench or example targets that dominate lane time.
          #
          # Repos that genuinely unwrap in src/ still set `allow_unwrap_used:
          # true`. That drops -D clippy::unwrap_used from the tier entirely, so
          # both passes agree and the second one costs nothing new.
          #
          # Word-splitting of the trusted flag list is intentional.
          # shellcheck disable=SC2046
          cargo clippy --workspace --all-targets -- $(get_clippy_deny_flags) -A clippy::unwrap_used
          # shellcheck disable=SC2046
          cargo clippy --workspace --lib --bins -- $(get_clippy_deny_flags)

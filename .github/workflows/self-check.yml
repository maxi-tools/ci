# This repository had no CI of its own.
#
# Every other file here is a `workflow_call` reusable, so none of them runs on
# a pull request. A change landed with three review-bot checks -- CodeRabbit,
# cubic, qlty -- and nothing that read the YAML. Meanwhile ~48 repositories
# execute these files at a pinned sha.
#
# It showed. PR #10 shipped the fan-out guard comparing `user.login` against
# a bot name, in a file whose own `plan` job pins its owner by NUMERIC ID and
# says why three lines further up. Nothing here objected. It was caught by
# Codacy, days later, on maxi-config's mirror of the same file -- by accident
# of the mirror existing, not by any gate in this repository.
#
# SELF-HOSTED, with a same-repo fork guard. This repository is PUBLIC, which
# is the entire reason it exists (GitHub will not resolve a `uses:` from a
# public repository into a private one). Fork pull requests are therefore
# expected here, and fork code must never reach the org's self-hosted fleet.
# The guard below (`head.repo.full_name == github.repository`) makes the
# check SKIP on a fork pull request, which leaves the `self-check` status
# absent and the merge blocked rather than permitted -- exactly the
# outcome the previous hosted-only behaviour produced. Every other
# self-hosted job in the org carries the same guard for the same reason.
#
# Same-repo PRs land on the org's self-hosted `[self-hosted, Linux, X64]`
# pool and execute every step against PR-controlled Python / Node test
# files (`tests/test_*.py`, `tests/test_moments_gallery_browser.js`).
# The cost is the minutes the previous hosted-only run consumed; the
# isolation is preserved by the fork guard.
name: Self-check

on:
  pull_request:
  push:
    branches: [main]

# Read-only. This lane only reads YAML; a token that can write is a token a
# fork pull request could aim at something.
permissions:
  contents: read

concurrency:
  group: self-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  self-check:
    # Same-repo fork guard. A fork pull request's token is read-only and
    # its `head.repo.full_name != github.repository`, so the `if:` makes
    # the job SKIP -- which GitHub reports as the absence of the
    # `self-check` context, and a ruleset that requires that context
    # (`ci-protect-main`, ID 22719524) blocks the merge rather than
    # permitting it. A fork PR's code never reaches the self-hosted
    # pool, and a fork PR's contributor cannot bypass the check by
    # editing the workflow file because `actions/checkout` runs only
    # inside the job's steps -- none of which run on a fork.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Nothing here pushes, so the runner should not carry the credential
          # into .git/config.
          persist-credentials: false
          # fetch-depth: 0 (full history) so the caller/callee pin tests
          # (tests/test_review_gate_transitive_pin.py and
          # tests/test_review_gate_secret_contract.py) can `git cat-file -p
          # <sha>:.github/workflows/review-gate-reusable.yml` against the
          # commit the local caller pins. The default `fetch-depth: 1`
          # (shallow) does NOT include those commits, and the tests then
          # fail with `fatal: path ... exists on disk, but not in <sha>`.
          # Repo is ~390 commits; the fetch cost is negligible, and a
          # shallow checkout offers nothing here (no `git log` walks the
          # history -- the only callers are the pin tests, which need
          # exact commits).
          fetch-depth: 0

      - name: actionlint
        # Reads every workflow, checks expression syntax, and shellchecks the
        # `run:` blocks. A malformed `if:` in a reusable is not a local bug --
        # it is ~48 repositories failing at once.
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: ".github/workflows/*.yml"
          fail-on-error: true
          # The action defaults to provisioning pyflakes via pipx and
          # shellcheck via apt-get, neither of which is available on the
          # org's self-hosted runners. Disable them explicitly so the
          # action doesn't try to install them; the YAML / expression
          # checks above are what matter for this lane, and a Python
          # / shellcheck pass is run by `test_review_gate_route_shim.py`
          # and the existing python test suites anyway.
          pyflakes: false
          shellcheck: false

      - name: Check `uses:` references
        # Two properties actionlint does not cover: that a relative call
        # resolves inside this repository, and that every external action is
        # sha-pinned. Both fail somewhere other than here.
        run: python3 .github/scripts/check_workflow_refs.py

      - name: Smoke-test fanout_ci_pin.py
        # The fan-out is a real script, not just a doc, and is invoked from
        # fanout-ci-pin.yml with the org token. A script that crashes on a
        # bad tip is invisible until a real fan-out runs (which may take a
        # week), so this step proves the script accepts a valid sha,
        # rejects an invalid one, and exits cleanly with an empty consumer
        # list. The plan step is exercised by fanout-ci-pin.yml's weekly
        # cron, where the org token is present.
        run: |
          set -euo pipefail
          sha=0000000000000000000000000000000000000000
          if python3 .github/scripts/fanout_ci_pin.py --tip "$sha" --help >/dev/null; then
            :
          else
            echo "ERROR: fanout_ci_pin.py --help exited non-zero" >&2
            exit 1
          fi
          # Bad tip: script must exit non-zero.
          if python3 .github/scripts/fanout_ci_pin.py --tip "not-a-sha"; then
            echo "ERROR: fanout_ci_pin.py accepted a non-sha tip" >&2
            exit 1
          fi
          # Good tip --dry-run --json must exit zero and emit JSON.
          # GITHUB_SHA is the merge commit on a PR merge, and the
          # pushed commit on a direct push; the fan-out's `--tip` is
          # always one of those. The checkout may be shallow, so we
          # cannot assume `git rev-parse` of an arbitrary sha resolves;
          # the script only validates the SHA FORMAT (40-char hex),
          # which the env var satisfies.
          sha="${GITHUB_SHA:?GITHUB_SHA is required}"
          empty_list="$(mktemp)"
          trap 'rm -f "$empty_list"' EXIT
          : > "$empty_list"
          python3 .github/scripts/fanout_ci_pin.py \
            --tip "$sha" --consumer-list-file "$empty_list" --dry-run --json
          echo 'fanout_ci_pin.py accepts, rejects, and exits cleanly on an empty list'

      - name: Run the test suites
        # Each file directly, by name, with a failure flag -- the same
        # shape as maxi-config's script-tests lane, for the same reason:
        # `unittest discover` needs an importable start directory, and a
        # suite nobody lists here is run by nothing. tests/
        # test_dedupe_review_threads.py (52 tests) sat unrun from ci#9 to
        # ci#29 -- the smoke test above was this repository's only
        # Python check, and it proves the fan-out script parses, not
        # that it fans out. test_fanout_ci_pin.py is the one that
        # would have caught --json returning before execution.
        run: |
          set -euo pipefail
          # workspace-guard parses YAML; hosted Python does not guarantee PyYAML.
          python3 -m venv "$RUNNER_TEMP/moments-python"
          . "$RUNNER_TEMP/moments-python/bin/activate"
          python3 -m pip install PyYAML==6.0.3
          failed=0
          for t in tests/test_dedupe_review_threads.py tests/test_fanout_ci_pin.py tests/test_impossible_caller_contexts.py tests/test_lane_decisions.py tests/test_parse_summary.py tests/test_review_gate_route_shim.py tests/test_review_gate_secret_contract.py tests/test_review_gate_transitive_pin.py tests/test_self_check_fork_guard.py tests/test_roster_label_login.py tests/test_roster_parse.py tests/test_collect_roster_statuses.py tests/test_ci_design_permissions.py tests/test_trusted_bot_approval.py tests/test_workspace_guard.py tests/test_swift_skip_env.py tests/test_moments_gallery.py tests/test_moments_png_filters.py tests/test_mac_lanes_contract.py tests/test_plan_lane.py; do
            echo "== $t"
            if ! python3 "$t"; then
              echo "::error file=$t::$t failed"
              failed=1
            fi
          done
          # resolve_runner_test.py lives under the action (so the composite
          # action step can import it directly when needed) but the routing
          # logic it exercises -- overflow_to, lane_queue_minutes, the
          # probe_runner_state client-guard -- is the heart of PR #98's
          # contract. The verifier's REJECT fixture (Linux-saturated + idle
          # Mac pool -> Mac labels) only proves it from this script, so
          # running it here is the difference between the fixture having
          # run green in CI and it not being in the CI loop at all.
          echo "== .github/actions/resolve-runner/resolve_runner_test.py"
          if ! python3 .github/actions/resolve-runner/resolve_runner_test.py; then
            echo "::error file=.github/actions/resolve-runner/resolve_runner_test.py::resolve_runner_test failed"
            failed=1
          fi
          # Non-vacuity: every tests/test_*.py must be in the list above.
          for f in tests/test_*.py; do
            case " tests/test_dedupe_review_threads.py tests/test_fanout_ci_pin.py tests/test_impossible_caller_contexts.py tests/test_lane_decisions.py tests/test_parse_summary.py tests/test_review_gate_route_shim.py tests/test_review_gate_secret_contract.py tests/test_review_gate_transitive_pin.py tests/test_self_check_fork_guard.py tests/test_roster_label_login.py tests/test_roster_parse.py tests/test_collect_roster_statuses.py tests/test_ci_design_permissions.py tests/test_trusted_bot_approval.py tests/test_workspace_guard.py tests/test_swift_skip_env.py tests/test_moments_gallery.py tests/test_moments_png_filters.py tests/test_mac_lanes_contract.py tests/test_plan_lane.py " in
              *" $f "*) ;;
              *) echo "::error file=$f::$f exists but is not run by this lane; add it to the list"; failed=1 ;;
            esac
          done
          exit "$failed"

      - name: Browser regression for moments gallery
        run: |
          set -euo pipefail
          # The self-hosted runner does not ship the chromium runtime
          # dependencies (libnspr4 / libnss3 / libgbm1 / libxkbcommon0 / ...).
          # The hosted image did. Provision them with sudo + apt-get so the
          # test runs on the same lane as the rest of self-check.
          if command -v sudo >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
              libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
              libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
          else
            echo "::warning::sudo/apt-get not available; relying on system libraries"
          fi
          npm install --prefix "$RUNNER_TEMP/moments-browser" --no-save playwright@1.63.0
          export NODE_PATH="$RUNNER_TEMP/moments-browser/node_modules"
          "$RUNNER_TEMP/moments-browser/node_modules/.bin/playwright" install chromium
          node tests/test_moments_gallery_browser.js

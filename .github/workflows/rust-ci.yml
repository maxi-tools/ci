# Shared Rust CI lane composition for maxi-tools repos.
# packaging/signing lanes must not be required PR checks; require merge-gate, check, and test instead.

name: CI / Rust lanes

on:
  workflow_call:
    inputs:
      repo_policy:
        description: Consumer repository policy profile.
        required: false
        type: string
        default: standard-rust
      checkout_submodules:
        description: Recursively initialize Git submodules before Cargo runs.
        required: false
        type: boolean
        default: false
      skip_swift_build:
        description: Skip repository Swift build scripts in Rust-only lanes.
        required: false
        type: boolean
        default: false
      allow_unwrap_used:
        description: Temporarily allow unwrap_used for repositories with a legacy baseline.
        required: false
        type: boolean
        default: false
      mac_lanes:
        # Opt-in declaration that this consumer keeps heavy macOS jobs in its
        # own standalone workflow(s), and that those workflows wait on THIS
        # template's Linux gate before claiming a Mac runner. Non-empty means
        # the consumer has (or is adopting) a completion-triggered Mac lane;
        # the output below is what the standalone workflow reads. Empty (the
        # default) changes nothing for the 57 wrappers that do not use it.
        # The fan-out renderer (scripts/rust_ci_render.py in maxi-config)
        # special-cases a non-empty consumer value so the declaration
        # survives the weekly tick the way a fork's repo_policy does.
        description: Declared standalone macOS lane(s) that gate on this workflow's linux_gate output.
        required: false
        type: string
        default: ''
    outputs:
      linux_gate:
        # The fail-fast handoff for standalone macOS lanes. `needs.merge-gate`
        # has `always()` in its `if:` (the fork-tripwire shape, above), so the
        # job is present -- and this output is published -- even when a lane
        # failed: the value is the job's RESULT, not a boolean, precisely so
        # the consumer can distinguish "still running" (no event) from
        # "concluded" (completed webhook) from "concluded red" (failure).
        # `skipped` is a passing value by the same rule the Aggregate step
        # uses: fan-out and docs-only PRs skip lanes deliberately, and those
        # PRs must not wedge the consumer's Mac lane forever.
        description: Result of this workflow's merge-gate aggregate (success, skipped, failure, or cancelled).
        # Routed through a job-level output rather than read directly as
        # `jobs.merge-gate.result` on purpose. The direct form is valid per
        # GitHub's contexts reference, but actionlint types a job that CALLS
        # a reusable workflow as {outputs: {}} and flags `.result` on it
        # (rhysd/actionlint#343) -- and self-check.yml runs actionlint with
        # fail-on-error. `job.status` in the final always() step IS the job
        # conclusion, so the published value is identical.
        value: ${{ jobs.merge-gate.outputs.gate_result }}
    secrets:
      APP_ID:
        description: GitHub App ID used for read-only private repository access.
        required: false
      APP_PRIVATE_KEY:
        description: GitHub App private key paired with APP_ID.
        required: false

# workflow_call ONLY, unlike the copy this was moved from.
#
# In maxi-config this file also carried `push`, `pull_request` and
# `workflow_dispatch`, because maxi-config is itself a Rust workspace and those
# triggers ran its own CI -- redundantly, since maxi-config also vendors the
# wrapper. Two things are true here and neither was true there: this repository
# contains no Cargo workspace, so a self-triggered lane would `cargo fmt` a tree
# with no Cargo.toml and be permanently red; and a repository that exists to be
# CALLED should not also be a caller, or its own runs become indistinguishable
# from its consumers' on the Actions tab.
#
# Consumers are unaffected -- they reach this file through `uses:`, which is the
# `workflow_call` trigger, and every `github.event_name` test below reads the
# CALLER's event, not this file's triggers.
permissions: {}

env:
  CI_ENFORCEMENT_MODE: ${{ vars.CI_ENFORCEMENT_MODE || 'degraded' }}
  CI_DEGRADED_UNTIL: ${{ vars.CI_DEGRADED_UNTIL || '2026-08-01' }}
  CARGO_TERM_COLOR: always
  # Pin the target dir to the job workspace so a runner-level CARGO_TARGET_DIR
  # (e.g. a shared farm cache in the runner service .env) can never redirect
  # build output or make concurrent jobs serialize on one build-dir flock,
  # where the cpu-liveness guard kills the lock-waiter at 0% CPU.
  # Fleet policy: cross-run reuse belongs in sccache; Cargo target dirs stay
  # workspace-local and disposable.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  merge-gate:
    # Same-repo pull requests, and merge-queue group heads whose only action
    # is `checks_requested`. This job is pure bash today -- it echoes two
    # workflow variables and runs `date` -- and that is NOT why it is safe,
    # because it is not a property a fork has to leave alone. For
    # `pull_request`, GitHub runs the workflow file from the PR's merge
    # commit, so a fork PR supplies this `run:` block along with everything
    # else in the file. "Inspect what the shell body currently does" is a
    # review of the base branch, not a boundary around what will execute on
    # `[self-hosted, Linux]`.
    #
    # Stated plainly because the guard is easy to over-read: this closes the
    # DECLARED lanes. A fork PR can also add a job that was never here, and no
    # `if:` in this file constrains that -- the boundary for that is the org's
    # "self-hosted runners for fork pull requests" setting plus required
    # approval for outside contributors, both of which are set at org level.
    #
    # The merge_group arm (maxi-core#4875 pattern): a merge-group ref is
    # assembled by GitHub from PRs already admitted to the merge queue, and
    # its only trust-relevant action is `checks_requested` -- only someone
    # allowed to merge can admit a PR, so queue admission IS the trust
    # boundary for this event and the same-repo fork guard does not apply to
    # it. The five merge-queue lifecycle actions (`created`, `merged`,
    # `pushed`, `removed`, `deleted`) are NOT admitted here: they must not
    # mint a required-context check run.
    #
    # AGGREGATE, not just a sentinel. This job is the SOLE required context
    # under the post-merge-gate ruleset (maxi-tools/ci#<this PR> +
    # maxi-tools/maxi-config#<mirrored PR>); if a required lane reports
    # FAILURE while this concludes SUCCESS, the ruleset is structurally
    # weaker than the lanes it is supposed to replace. So `merge-gate` waits
    # on every declared lane job (`needs:` below) and re-evaluates their
    # results in a step that always runs -- skipped lanes (fan-out case) are
    # fine, but failure or cancellation MUST surface as a FAILURE conclusion
    # here, not as a green check that hides a red lane.
    #
    # `if:` adds `always()` so this gate's check run is present whether its
    # needs succeeded OR failed -- without it, a failing `check`/`test` skips
    # this job and the required context vanishes. That is precisely the
    # failure mode this slice exists to fix. The gate therefore NEVER skips
    # itself on either admitted event; on a merge_group head the gates that
    # never skip are the whole point (the queue synthesizes a head the
    # pull_request-only lanes would otherwise not report on).
    #
    # Spelled so the fork/queue guards are NEGATED disjuncts, not a bare
    # positive event allowlist: the #346 rule (tests/test_self_hosted_
    # fork_guard.py) rejects `event_name == 'x' || <guard>` because an
    # allowlist silently drops any trigger added to `on:` later. The
    # leading conjunct keeps the event surface EXACTLY what it was
    # (pull_request + merge_group, nothing admitted by accident), and each
    # following conjunct is one event's trust boundary in the accepted
    # negated spelling: same-repo for pull_request, queue admission
    # (checks_requested) for merge_group.
    if: >-
      (github.event_name == 'pull_request' ||
      github.event_name == 'merge_group') &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'merge_group' ||
      github.event.action == 'checks_requested') &&
      always()
    needs: [plan, check, test, package, sign-publish, release-verify]
    outputs:
      # Consumed by on.workflow_call.outputs.linux_gate. Kept as a job-level
      # output instead of a direct `jobs.merge-gate.result` read so
      # actionlint's reusable-call typing (rhysd/actionlint#343) does not
      # fail self-check on a valid expression.
      gate_result: ${{ steps.gate-result.outputs.result }}
    # Deliberately self-hosted rather than a hosted runner: when hosted
    # capacity is unavailable a job is rejected before a runner is assigned --
    # zero steps, no log, seconds to "failure" -- so this sentinel reported the
    # PR broken without ever evaluating the enforcement mode it exists to
    # report. It is pure bash (echo and date), so any POSIX lane runs it --
    # which is why the architecture is not pinned. `X64` here bought nothing
    # and cost capacity: this job needs a shell and a clock, and excluding
    # arm64 kept it queueing behind a saturated x64 pool for no reason. The
    # canonical copy in maxi-config has been `[self-hosted, Linux]` for a
    # while; this brings the two back into agreement.
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - name: Report CI enforcement mode
        shell: bash
        run: |
          set -euo pipefail
          echo "CI enforcement mode: $CI_ENFORCEMENT_MODE"
          echo "CI degraded mode expires: $CI_DEGRADED_UNTIL"
          if [ "$CI_ENFORCEMENT_MODE" = "degraded" ]; then
            {
              echo "## CI enforcement mode"
              echo "- mode: degraded"
              echo "- expires: $CI_DEGRADED_UNTIL"
              echo "- required lanes stay lightweight while runner/network work is restored"
            } >> "$GITHUB_STEP_SUMMARY"
            today="$(date -u +%Y-%m-%d)"
            if [ "$today" \> "$CI_DEGRADED_UNTIL" ]; then
              echo "::error::CI degraded mode expired on $CI_DEGRADED_UNTIL; set CI_ENFORCEMENT_MODE=strict or extend CI_DEGRADED_UNTIL with an explicit owner."
              exit 1
            fi
          elif [ "$CI_ENFORCEMENT_MODE" != "strict" ]; then
            echo "::error::Unknown CI_ENFORCEMENT_MODE=$CI_ENFORCEMENT_MODE"
            exit 1
          fi
          {
            echo "## merge-gate summary"
            echo "- this job is the aggregate of every declared lane and is the sole required context under the new ruleset"
            echo "- a lane reporting failure or cancellation surfaces here as a FAILURE conclusion, not as a green check"
            echo "- package/sign/release lanes are deferred unless packaging impact or trusted release refs require them"
            echo "- on a merge_group head a skipped check/test lane passes only when the change detector reports no relevant change (scope=merge-gate-only)"
          } >> "$GITHUB_STEP_SUMMARY"
      # Always runs so a failed upstream lane is reported by THIS job, not by
      # the lane itself (which the ruleset no longer requires).
      #
      # What a SKIPPED lane means now depends on the event, because it means
      # two different things (maxi-core#4875's (a)/(b) distinction):
      #
      #   pull_request -- `skipped` is the fan-out and docs-only path, decided
      #     inside the lane jobs (Dependabot actor, merge-gate-only scope,
      #     fan-out branch). That skip is deliberate and stays acceptable.
      #
      #   merge_group -- the queue head is the candidate merge. A skipped
      #     check/test lane here is merge evidence ONLY when the change
      #     detector positively reports no relevant change
      #     (`plan.outputs.scope == 'merge-gate-only'`, the same sentinel the
      #     lanes themselves consult). Anything else -- a router that fell
      #     over, a lane never scheduled, the plan job failed before the
      #     classifier ran -- means nothing was verified and nobody chose
      #     that, which is exactly the #3218 shape. So the merge_group arm
      #     requires the skip to be positively explained, and `scope` missing
      #     or unfamiliar fails closed. `package`/`sign-publish`/
      #     `release-verify` keep the pull_request semantics on BOTH events:
      #     they are release-ref lanes, not diff lanes, and a merge-group run
      #     legitimately leaves them skipped.
      #
      # Outside a degraded window (today > CI_DEGRADED_UNTIL, or the expiry
      # unset) the strict arm additionally requires every merge_group skip
      # to be rejected regardless of the detector's scope -- a `skipped`
      # that arrived with `scope=merge-gate-only` (the lane-side guard
      # accepted the docs-only path) no longer passes the gate, the same
      # equality-not-non-failure shape maxi-core's security-gate was held
      # to (verifier t_caba2c83 criterion c). Inside the window the
      # historical shape holds: failure and cancellation never pass, and a
      # queue-head skip still needs the detector's positive verdict. The
      # strict arm is deliberately merge_group-only: on pull_request the
      # fan-out skip (a maxi-config-sync/* head, gated on branch prefix AND
      # distributor id) is a deliberate skip with scope=full, and the
      # degraded window must not turn every fan-out PR red. Fail-closed on
      # a missing expiry, the same shape qodana's degraded gate uses.
      - name: Aggregate lane results
        if: always()
        shell: bash
        env:
          MERGE_GATE_NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PLAN_SCOPE: ${{ needs.plan.outputs.scope }}
          CI_ENFORCEMENT_MODE_VALUE: ${{ env.CI_ENFORCEMENT_MODE }}
          CI_DEGRADED_UNTIL_VALUE: ${{ env.CI_DEGRADED_UNTIL }}
        run: |
          set -euo pipefail
          echo "Lane needs: $MERGE_GATE_NEEDS"
          # The needs context is read from the ENVIRONMENT, not argv: it is
          # unbounded (one entry per lane, each with outputs) and argv is
          # bounded by ARG_MAX. (codacy, maxi-config#790.)
          python3 <<'PY'
          import json, os, subprocess, sys

          # ALLOWLIST, not a denylist. The previous shape failed on
          # `failure` and `cancelled` only, so any other value -- a result
          # GitHub adds later, or an entry whose `result` key is missing
          # because a lane never reported -- passed the gate silently.
          # This job is the SOLE required context under the new ruleset, so
          # "a value I do not recognise" must mean stop, not proceed.
          PASSING = ("success", "skipped")

          # The heavy lanes the change detector governs. On a merge_group
          # head a `skipped` here is merge evidence only when the detector
          # positively says the diff cannot reach a build.
          HEAVY_LANES = ("check", "test")

          needs = json.loads(os.environ["MERGE_GATE_NEEDS"])
          event = os.environ.get("EVENT_NAME", "")
          action = os.environ.get("EVENT_ACTION", "")
          plan_scope = os.environ.get("PLAN_SCOPE", "")
          is_merge_group = event == "merge_group"

          # Degraded window, same fail-closed comparison the enforcement-mode
          # step above runs: an unset or empty CI_DEGRADED_UNTIL means the
          # window is NOT open, so strict enforcement applies. Evaluated only
          # when the strict arm is reached, but computed here so the report
          # below can print it.
          until = os.environ.get("CI_DEGRADED_UNTIL_VALUE", "")
          today = subprocess.run(["date", "-u", "+%Y-%m-%d"],
                                 capture_output=True, text=True,
                                 check=True).stdout.strip()
          degraded_in_window = bool(until) and today <= until

          bad = [(name, info.get("result")) for name, info in needs.items()
                 if info.get("result") not in PASSING]
          if bad:
              for name, result in bad:
                  print(f"::error::Required lane {name!r} reported {result!r}; "
                        "merge-gate fails.")
              sys.exit(1)

          # On a queue head every skipped heavy lane must be positively
          # explained by the change detector. `scope` absent or unfamiliar
          # fails closed: a plan job that fell over before the classifier
          # ran publishes no output, and an unexplained skip is the exact
          # "green with nothing compiled" hole this gate exists to close.
          #
          # Two arms, deliberately different predicates so each does work
          # the other doesn't:
          #
          #   INSIDE the degraded window -- accept the historical shape: a
          #   heavy-lane skip with `scope != 'merge-gate-only'` is a
          #   misclassified skip and must exit (plan reports the lane ran
          #   but could not positively classify the change).
          #
          #   OUTSIDE the degraded window -- strict equality, the same
          #   shape maxi-core's security-gate was held to (verifier
          #   t_caba2c83 criterion c): a heavy-lane skip on merge_group is
          #   rejected regardless of what scope the change detector
          #   reports, because outside the window the gate's promise is
          #   that the lane actually ran and passed. A `merge-gate-only`
          #   skip that the lane fan-out itself permitted (the
          #   `!should_run` docs-only path) is no longer acceptable when
          #   the degraded waiver is closed.
          #
          # The previous single-block-and-strict-arm concatenation wrote
          # the same predicate twice (cubic P3 / coderabbit P2 / codacy
          # P2 -- the strict arm was unreachable because every input
          # that would have tripped it had already exited at the first
          # block). The two arms now cover disjoint inputs.
          if is_merge_group:
              skipped_heavy = [name for name in HEAVY_LANES
                               if needs.get(name, {}).get("result") == "skipped"]
              if not skipped_heavy:
                  pass  # every heavy lane ran; nothing to adjudicate
              elif degraded_in_window:
                  if plan_scope != "merge-gate-only":
                      print("::error::merge_group: heavy lane(s) "
                            f"{skipped_heavy!r} skipped but the change "
                            f"detector reports scope={plan_scope!r} "
                            "(expected 'merge-gate-only'); inside the "
                            f"degraded window (CI_DEGRADED_UNTIL={until or '<unset>'}, "
                            f"today={today}) a queue head may only skip a "
                            "heavy lane when the detector positively "
                            "reports no relevant change.")
                      sys.exit(1)
              else:
                  print("::error::merge_group: heavy lane(s) "
                        f"{skipped_heavy!r} skipped but the degraded "
                        f"window is closed (CI_DEGRADED_UNTIL={until or '<unset>'}, "
                        f"today={today}); strict enforcement requires the "
                        "lane to have run and succeeded on the queue head. "
                        f"(scope reported by the detector: {plan_scope!r}; "
                        "the strict arm rejects every skip outside the "
                        "window regardless of scope.)")
                  sys.exit(1)

          skipped = [name for name, info in needs.items()
                     if info.get("result") == "skipped"]
          print(f"All required lanes passed (or were positively skipped). "
                f"event={event} action={action!r} scope={plan_scope!r} "
                f"degraded_in_window={str(degraded_in_window).lower()} "
                f"skipped={skipped}")
          PY

      # Published for the linux_gate workflow output (see on.workflow_call
      # above): standalone macOS lanes in wrapper repositories read this as
      # their fail-fast handoff. Always runs, for the same reason Aggregate
      # does -- a failed lane must still produce a published conclusion.
      - name: Publish gate result
        id: gate-result
        if: always()
        env:
          GATE_RESULT: ${{ job.status }}
        shell: bash
        run: echo "result=$GATE_RESULT" >> "$GITHUB_OUTPUT"

  plan:
    # The gate for the WHOLE lane chain. `check`, `test`, `package`,
    # `sign-publish` and `release-verify` all require
    # `needs.plan.result == 'success'`, so a condition here is the one place
    # that decides whether any of them reach the fleet.
    #
    # Two clauses, two different holes. The first keeps fork pull requests out:
    # the lanes below check out the head tree and run cargo over it on
    # persistent runners holding an org App token.
    #
    # The second is the dispatch hole the first one hid. A `workflow_dispatch`
    # is not a pull request, so `github.event_name != 'pull_request'` cleared
    # it unconditionally -- and `gh workflow run --ref` accepts ANY branch, so
    # anyone with write access to a consumer repository could dispatch its CI
    # at a branch of their own and have the fleet build that branch. Pinned to
    # the owner by numeric id, which the trusted-actor policy also pins; logins
    # can be reassigned, ids cannot. The ref is deliberately NOT pinned:
    # dispatching CI at a work-in-progress branch is the normal use.
    #
    # `push` keeps its unconditional clearance -- this workflow's push trigger
    # is `branches: [main, release/**]`, i.e. post-merge code.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_dispatch' || github.event.sender.id == 874012) }}
    uses: ./.github/workflows/lane-plan.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
    with:
      base_ref: ${{ github.event.before || 'origin/main' }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # NOT ON THE FAN-OUT and NOT ON DOCS-ONLY CHANGES -- decided inside the
  # lane, not here. The measurements behind both skips (48 consumer PRs
  # per distribute run against 35 runners; ~160s of Rust lane time per
  # docs-only PR) and the both-halves identity rule are recorded on the
  # lane job's `if:`.
  check:
    needs: plan
    # No `if:` here on purpose. The docs-only and fan-out skips live INSIDE
    # lane-check.yml (with the Dependabot one), because skipping THIS job
    # skips the reusable workflow and the nested check run
    # `merge-gate / check / lane-check` is then never created -- absent, not
    # skipped -- and the fleet's rulesets require it by that name. See the
    # `if:` on the lane job for the full account. `scope` is passed down so
    # the lane can make the decision this job used to make.
    uses: ./.github/workflows/lane-check.yml
    permissions:
      contents: read
    with:
      runs_on: ${{ needs.plan.outputs.runs_on }}
      scope: ${{ needs.plan.outputs.scope }}
      advisory: ${{ github.event_name == 'pull_request' && vars.CI_ENFORCEMENT_MODE != 'strict' }}
      checkout_submodules: ${{ inputs.checkout_submodules == true }}
      skip_swift_build: ${{ inputs.skip_swift_build == true }}
      allow_unwrap_used: ${{ inputs.allow_unwrap_used == true }}
      # Forwarded unchanged. lane-check reads it to skip house-style steps
      # when the consumer set repo_policy: fork-upstream. A literal here
      # would strip that choice.
      repo_policy: ${{ inputs.repo_policy }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # NOT ON THE FAN-OUT and NOT ON DOCS-ONLY CHANGES -- decided inside the
  # lane, not here. The measurements behind both skips (48 consumer PRs
  # per distribute run against 35 runners; ~160s of Rust lane time per
  # docs-only PR) and the both-halves identity rule are recorded on the
  # lane job's `if:`.
  test:
    needs: plan
    # No `if:` here on purpose. The docs-only and fan-out skips live INSIDE
    # lane-test.yml (with the Dependabot one), because skipping THIS job
    # skips the reusable workflow and the nested check run
    # `merge-gate / test / lane-test` is then never created -- absent, not
    # skipped -- and the fleet's rulesets require it by that name. See the
    # `if:` on the lane job for the full account. `scope` is passed down so
    # the lane can make the decision this job used to make.
    uses: ./.github/workflows/lane-test.yml
    permissions:
      contents: read
    with:
      runs_on: ${{ needs.plan.outputs.runs_on }}
      scope: ${{ needs.plan.outputs.scope }}
      advisory: ${{ github.event_name == 'pull_request' && vars.CI_ENFORCEMENT_MODE != 'strict' }}
      checkout_submodules: ${{ inputs.checkout_submodules == true }}
      skip_swift_build: ${{ inputs.skip_swift_build == true }}
      # Forwarded for parity with lane-check. lane-test does not gate on it.
      repo_policy: ${{ inputs.repo_policy }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  package:
    if: ${{ always() && needs.plan.result == 'success' && (needs.check.result == 'success' || needs.check.result == 'skipped') && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: [plan, check, test]
    uses: ./.github/workflows/lane-package.yml
    permissions:
      contents: read
    with:
      runs_on: ${{ needs.plan.outputs.runs_on }}
      should_run: ${{ needs.plan.outputs.packaging_impact == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
      skip_reason: no packaging impact on an ordinary PR
      checkout_submodules: ${{ inputs.checkout_submodules == true }}
      skip_swift_build: ${{ inputs.skip_swift_build == true }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  sign-publish:
    if: ${{ always() && needs.plan.result == 'success' && (needs.package.result == 'success' || needs.package.result == 'skipped') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    needs: [plan, package]
    uses: ./.github/workflows/lane-sign-publish.yml
    # The lane declares contents:write / id-token:write / pages:write inside
    # its own permissions: block for completeness, but its actual steps
    # (checkout with persist-credentials:false, download-artifact, and a
    # bash summary) only need contents:read. Granting write scopes here
    # would re-introduce the floor on every consumer that the design's
    # "no step needs a write scope" rule (test_ci_design_permissions)
    # deliberately tightened, so the call site stays at contents:read.
    permissions:
      contents: read
    with:
      runs_on: ${{ needs.plan.outputs.runs_on }}
      should_run: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
      skip_reason: sign-publish is restricted to trusted release refs
      artifact_name: ${{ needs.package.outputs.artifact_name }}

  release-verify:
    if: ${{ always() && needs.plan.result == 'success' && (needs.package.result == 'success' || needs.package.result == 'skipped') && (needs.sign-publish.result == 'success' || needs.sign-publish.result == 'skipped') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    needs: [plan, package, sign-publish]
    uses: ./.github/workflows/lane-release-verify.yml
    permissions:
      contents: read
    with:
      runs_on: ${{ needs.plan.outputs.runs_on }}
      should_run: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
      skip_reason: release verification is restricted to trusted release refs
      artifact_name: ${{ needs.package.outputs.artifact_name }}

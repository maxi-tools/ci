# Reusable plan lane for maxi-tools Rust CI.
name: CI lane / plan

on:
  workflow_call:
    inputs:
      lane:
        required: false
        type: string
        default: linux-x64
      workflow_family:
        required: false
        type: string
        default: rust
      packaging_policy_path:
        required: false
        type: string
        default: .maxi-config/ci/packaging-paths.toml
      base_ref:
        required: false
        type: string
        default: origin/main
      planner_runs_on:
        description: >
          Runner label for the PLAN job itself, as a bare label or a JSON
          array string. Deliberately NOT named runs_on: this workflow already
          has an OUTPUT called runs_on, and it means the opposite end of the
          pipeline -- where the resolved BUILD lanes go. Conflating the two
          would let a caller think it was routing the build when it was
          routing the router.
        required: false
        type: string
        default: '["self-hosted", "Linux", "X64"]'
    outputs:
      runs_on:
        value: ${{ jobs.lane-plan.outputs.runs_on }}
      provider:
        value: ${{ jobs.lane-plan.outputs.provider }}
      packaging_impact:
        value: ${{ jobs.lane-plan.outputs.packaging_impact }}
      packaging_reason:
        value: ${{ jobs.lane-plan.outputs.packaging_reason }}
      scope:
        description: >
          Validation scope for the lane chain. One of `merge-gate-only` (all
          changed paths are documentation/metadata — safe to skip check/test)
          or `full` (at least one changed path is non-doc — run everything).
        value: ${{ jobs.lane-plan.outputs.scope }}
      scope_reason:
        description: Human-readable explanation of the scope decision.
        value: ${{ jobs.lane-plan.outputs.scope_reason }}

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  lane-plan:
    # Routed to a self-hosted lane rather than a hosted runner.
    #
    # The durable rule, which is the part worth keeping: route by what a pool
    # can UNIQUELY do, not only by how deep its queue is today. This job is a
    # router -- it builds nothing, resolves a runner, lists changed files over
    # the API and runs a short awk script. Putting a capability-free job into
    # the queue of the only pool that can serve hardware-bound work costs
    # those lanes a runner and buys this job nothing.
    #
    # It is the worst job in the chain to leave queueing: check, test, package
    # and release-verify are all SKIPPED behind it, so one queued router gates
    # an entire repository's build chain.
    #
    # A default, not a pin -- pass `planner_runs_on` to route it elsewhere.
    # The decode below is the same idiom as lane-check.yml: a bare label passes
    # through, a JSON array string is parsed into a label list.
    #
    # Fleet inventory, pool sizes and the measurements behind this choice are
    # recorded privately in maxi-config; they change faster than this file.
    runs-on: ${{ (startsWith(inputs.planner_runs_on, '[') || startsWith(inputs.planner_runs_on, '"')) && fromJSON(inputs.planner_runs_on) || inputs.planner_runs_on }}
    # Control-plane job: observed runs are ~0.2 min. A tight bound keeps a
    # wedged router from stalling the whole lane chain behind it.
    timeout-minutes: 15
    outputs:
      runs_on: ${{ steps.resolve.outputs.runs-on || steps.dependabot-fallback.outputs.runs-on || steps.credentials-fallback.outputs.runs-on }}
      provider: ${{ steps.resolve.outputs.provider || steps.dependabot-fallback.outputs.provider || steps.credentials-fallback.outputs.provider }}
      packaging_impact: ${{ steps.packaging.outputs.packaging_impact || steps.dependabot-fallback.outputs.packaging_impact || steps.credentials-fallback.outputs.packaging_impact }}
      packaging_reason: ${{ steps.packaging.outputs.packaging_reason || steps.dependabot-fallback.outputs.packaging_reason || steps.credentials-fallback.outputs.packaging_reason }}
      scope: ${{ steps.scope.outputs.scope || steps.dependabot-fallback.outputs.scope || steps.credentials-fallback.outputs.scope }}
      scope_reason: ${{ steps.scope.outputs.scope_reason || steps.dependabot-fallback.outputs.scope_reason || steps.credentials-fallback.outputs.scope_reason }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # TRUST ADMISSION -- step 1 of this self-hosted job, never a job-level
      # `if:` (maxi-tools standing rule). A job-level guard turns an untrusted
      # run into a SKIPPED lane, and `skipped` is precisely the result an
      # aggregate can be talked into reading as green. Here the untrusted run
      # goes RED before checkout, before any token is minted, before any PR
      # content exists on the runner. Every later step has an implicit
      # `success()` (or names `steps.trust-admission.outcome`), so nothing
      # after this one runs once it fires.
      #
      # Trusted: a same-repo pull request, an admitted merge-queue head
      # (`checks_requested` -- only someone allowed to merge can admit one),
      # a workflow_dispatch by the owner's numeric id (874012, the id the
      # trusted-actor policy pins; logins can be reassigned, ids cannot), and
      # push / schedule (callers' push trigger is `branches: [main,
      # release/**]`, post-merge code; a schedule runs the default branch). Everything else -- including any trigger added to a
      # caller later -- fails here: an ALLOWLIST of trusted shapes, negated, so
      # an unknown event is untrusted by construction.
      - name: Trust admission
        id: trust-admission
        if: >-
          ${{ !(
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'merge_group' &&
          github.event.action == 'checks_requested') ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.sender.id == 874012)
          ) }}
        shell: bash
        env:
          TRUST_EVENT: ${{ github.event_name }}
          TRUST_ACTION: ${{ github.event.action }}
          TRUST_SENDER: ${{ github.event.sender.login }}
        run: |
          echo "::error::Untrusted ${TRUST_EVENT} run (action=${TRUST_ACTION:-none}, sender=${TRUST_SENDER:-unknown}): this self-hosted job only admits pushes and schedules, same-repo pull requests, admitted merge-queue heads (checks_requested) and owner dispatches."
          exit 1

      # This job needs gh and python3. It does NOT need standalone jq -- the
      # only --jq below is gh's own built-in, which is compiled into gh -- so
      # jq is deliberately not required here. Demanding a tool the job never
      # runs would fail boxes closed for no reason.
      #
      # Checked, not provisioned. These tools arrive with the runner image, so
      # a box without one is a box to fix rather than a job to patch.
      #
      # The step stays, and stays FIRST, for the reason python3 was always
      # checked here: the resolve-runner action finds its own interpreter and
      # fails with its own message, but it runs FOUR steps in -- after two
      # checkouts and a minted app token. Failing here costs about a second
      # and names the tool. This router is what every downstream lane is
      # SKIPPED behind; its failures have to say why.
      - name: Check the planner's tools are on PATH
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tool in gh python3; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::${missing[*]} absent on ${RUNNER_NAME:-this runner}; the plan lane cannot resolve a runner"
            exit 1
          fi

      # Required by the optional-secret contract from maxi-config#368: callers
      # without APP_ID / APP_PRIVATE_KEY (forks, external contributors,
      # public-only lanes) must still produce a plan, even without an
      # App-token. The credential-dependent steps below this point are gated
      # on has_credentials. In credential-free mode we fall back to the
      # dependabot-style native runner.
      - name: Detect credentials
        id: credentials
        if: github.actor != 'dependabot[bot]'
        env:
          HAS_APP_ID: ${{ secrets.APP_ID != '' }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          if [ "$HAS_APP_ID" = "true" ] && [ "$HAS_APP_PRIVATE_KEY" = "true" ]; then
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APP_ID or APP_PRIVATE_KEY not forwarded by the caller; running lane-plan in credential-free mode (native runner only, no App-token mint, no private policy fetch)."
            {
              echo "## lane-plan summary"
              echo "- Credentials: absent; credential-free mode (native runner fallback, no App-token mint, no private policy fetch)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
          persist-credentials: false

      # Dependabot-triggered runs get the DEPENDABOT secrets scope, not the
      # ordinary Actions one, and this org holds no Dependabot secrets -- so
      # secrets.APP_ID / APP_PRIVATE_KEY arrive as empty strings, this step dies
      # with `The 'client-id' (or deprecated 'app-id') input must be set to a
      # non-empty string`, and lane-plan fails ~5s in. Every downstream lane
      # `needs:` this router, so all of them are then SKIPPED and the repo's
      # merge-gate reports a dependency bump as broken CI. Observed repeatedly
      # before this guard existed.
      #
      # Keyed on `github.actor`, not on the PR author, because the actor is what
      # GitHub keys the secrets restriction on: when a human pushes to a
      # dependabot/* branch the actor becomes that human and ordinary secrets
      # ARE available, so the real routing policy should be read. The other
      # dependabot guards in this fleet are keyed the same way.
      - name: Generate org repo token
        if: github.actor != 'dependabot[bot]' && steps.credentials.outputs.has_credentials == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          # Deliberately still `app-id` rather than `client-id`.
          #
          # This is a `workflow_call` workflow: it sees only the secrets its
          # CALLER passes, and the wrapper that consumers vendor forwards
          # `APP_ID` by name. Flipping to `client-id` takes effect in every
          # consumer the moment this file lands on main, while their wrappers
          # still forward only `APP_ID` -- an empty client-id and a failing
          # token step fleet-wide. The org secret existing does not help; a
          # called workflow cannot read a secret nobody handed it.
          #
          # Order of operations: thread `APP_CLIENT_ID` through the wrapper
          # template first, let the fan-out deliver it, then flip the call
          # sites.
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: maxi-tools
          # The resolver probe reads the org runner inventory and the CALLER
          # repo's queued runs, so the token must include the caller repo —
          # maxi-config alone 404s in every consumer repo (maxi-config#162).
          repositories: |
            maxi-config
            ${{ github.event.repository.name }}
          # Scoped to the three things this token is used for:
          #   contents: read      -- the sparse checkout of the policy repo
          #   actions: read       -- the resolver's queued-run probe,
          #                          GET /repos/{owner}/{repo}/actions/runs
          #   organization_self_hosted_runners: read
          #                       -- the resolver's fleet probe,
          #                          GET /orgs/{owner}/actions/runners
          #
          # The org endpoint is why `actions: read` alone is not enough: a repo
          # permission does not cover an org route, and the probe then 403s.
          #
          # State them. Without a `permission-*` input this mint inherits the
          # whole App installation rather than the read this lane needs -- a
          # large over-grant handed to a job that only reads files. The
          # incident and the scope tables are recorded privately in
          # maxi-config.
          permission-contents: read
          permission-actions: read
          permission-organization-self-hosted-runners: read

      - name: Checkout maxi-config policy
        if: github.actor != 'dependabot[bot]' && steps.credentials.outputs.has_credentials == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        timeout-minutes: 10
        with:
          repository: maxi-tools/maxi-config
          path: .maxi-config
          sparse-checkout: |
            /.github/actions/resolve-runner
            /ci/runner-routing.toml
            /ci/packaging-paths.toml
            /scripts/plan-packaging-impact.sh
          # Cone mode (the default) only accepts DIRECTORIES. Every path below
          # except the action directory is a FILE, and naming a file is fatal:
          #   fatal: 'ci/runner-routing.toml' is not a directory
          # It went unnoticed because git can only run that check when the index
          # has entries. A hosted runner is a fresh VM -> empty index -> file
          # paths are silently accepted. A persistent self-hosted runner REUSES
          # the clone -> populated index -> fatal. Reproduced against git 2.55.0,
          # the build the fleet runs: empty index exit 0, 243-entry index exit
          # 128, same command.
          #
          # So this broke the moment the lanes moved to persistent runners, and
          # it breaks on the SECOND job to land on a given runner, not the
          # first -- which is why one lane passed and its sibling failed on a
          # different box in the same hour.
          #
          # Non-cone mode takes gitignore-style patterns, so files work. The
          # leading slashes anchor each pattern to the repo root; git warns and
          # matches at any depth without them.
          sparse-checkout-cone-mode: false
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Resolve runner
        if: github.actor != 'dependabot[bot]' && steps.credentials.outputs.has_credentials == 'true'
        id: resolve
        uses: ./.maxi-config/.github/actions/resolve-runner
        with:
          lane: ${{ inputs.lane }}
          repo: ${{ github.event.repository.name }}
          job: ${{ inputs.workflow_family }}
          policy-path: .maxi-config/ci/runner-routing.toml
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Collect changed files
        id: files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ inputs.base_ref }}
          # The merge-queue base SHA, when this lane is called from a
          # merge_group event on a non-`main` target (release/** queues
          # are an explicit GitHub-supported shape). Populated here
          # rather than at the caller so the lane owns the resolution --
          # the same logic that owns the pull_request short-circuit.
          # Default empty so an unset event still falls through to
          # $BASE_REF; that is the same fail-safe as before. (ci#83
          # codex P1 review thread, PRRT_kwDOUUTR_s6o0w-D.)
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # `previous_filename` as well as `filename`: a rename emits
            # only the new name, and the classifier (and the docs-only
            # and packaging classifiers below) must see the old path a
            # rename abandoned -- an include_str! may still point at it.
            # The action's own API fallback already emits both; this
            # list is what reaches it here, so it must not be narrower.
            files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          elif [ -n "$MERGE_GROUP_BASE_SHA" ]; then
            # merge_group payload: $BASE_REF is meaningless here (a
            # merge-group event has no `before`, and the caller's
            # fallback to `origin/main` is wrong on a release queue).
            # The merge-group head SHA lives at ${{ github.sha }}; the
            # base SHA is the queue's chosen parent.
            files="$(git diff --name-only "$MERGE_GROUP_BASE_SHA" "${{ github.sha }}" || printf '%s\n' Cargo.lock)"
          else
            before="$BASE_REF"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            fi
            files="$(git diff --name-only "$before" "${{ github.sha }}" || printf '%s\n' Cargo.lock)"
          fi
          # 16 random bytes from /dev/urandom, not uuidgen: some runners carry
          # coreutils but no util-linux, so uuidgen is absent there and this
          # step died on an unbound delimiter. od is coreutils, present
          # everywhere, and 128 bits is the same collision margin a UUID gave.
          delimiter="CI_LANE_CHANGED_FILES_$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          {
            echo "changed_files<<$delimiter"
            printf '%s\n' "$files"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # The compiled-inputs classifier maxi-core uses (measured there:
      # 12 of the last 25 merged PRs touched no Rust and still spent
      # 352 runner-minutes in compile lanes), published here as an
      # action so PUBLIC consumers resolve it -- maxi-config's copy of
      # this step cannot serve them, which is the split this repository
      # exists for. Referenced by its full owner/repo path, not
      # `./.github/actions/...`, which would resolve against the
      # CALLER's workspace and find nothing.
      #
      # Fail direction: the action's outputs default to
      # `rust-touched=true` on every internal failure (unread diff,
      # unread index, unreadable repository), so a lane is skipped only
      # on a POSITIVE verdict that nothing in the diff can reach rustc.
      # The skip it produces is the `merge-gate-only` scope the lanes
      # already understand: a skipped lane's check run stays present as
      # `skipped`, which required-status-check evaluation accepts.
      - name: Decide whether the Rust lanes must run
        id: rust-touched
        uses: maxi-tools/ci/.github/actions/rust-touched@main
        with:
          changed-files: ${{ steps.files.outputs.changed_files }}

      - name: Classify change scope
        id: scope
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.files.outputs.changed_files }}
          # `${{-}}` interpolation of a failed step's outputs yields an
          # empty string, and the body below is also driven directly by
          # tests/test_lane_decisions.py with CHANGED_FILES alone -- so
          # the default lives in the BODY (`${RUST_TOUCHED:-true}`), not
          # only in the interpolation: the direction of a missing
          # verdict is ALWAYS run the lanes.
          RUST_TOUCHED: ${{ steps.rust-touched.outputs.rust-touched || 'true' }}
          RUST_TOUCHED_REASON: ${{ steps.rust-touched.outputs.rust-touched-reason || 'classifier did not report a verdict' }}
        run: |
          set -euo pipefail
          docs_only=true
          non_doc_first=""
          seen=0
          while IFS= read -r file; do
            # Whitespace-only lines are not filenames. Without the second
            # test a line of spaces counted as a changed file, which made
            # the empty-lookup case below unreachable for that input.
            [ -z "$file" ] && continue
            [ -z "${file//[[:space:]]/}" ] && continue
            seen=$((seen + 1))
            case "$file" in
              README.md|CHANGELOG.md|LICENSE*|.gitignore|docs/*|*.md) ;;
              *)
                docs_only=false
                [ -z "$non_doc_first" ] && non_doc_first="$file"
                ;;
            esac
          done <<< "$CHANGED_FILES"
          # An empty list is a FAILED LOOKUP, not a documentation-only PR.
          # A pull request always changes at least one file, so nothing to
          # classify means the collection step returned nothing -- and
          # `docs_only` starts true, so the previous shape answered
          # "skip check and test" to the question "I could not see the
          # diff". That is the fail-open this repository refuses elsewhere
          # by name: check-owned-files.py and check-intra-org-pins.py both
          # say an empty changed-file list is a failed lookup rather than a
          # clean PR. Same rule here, where the cost is skipping every
          # test lane in ~38 consumers. (codacy, maxi-config#790.)
          if [ "$seen" -eq 0 ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "scope_reason=changed-file lookup returned nothing; refusing to skip lanes on an unread diff" >> "$GITHUB_OUTPUT"
          elif [ "${RUST_TOUCHED:-true}" = "false" ]; then
            # The classifier's POSITIVE verdict that no changed path can
            # reach rustc: not documentation (a review-gate pin bump is
            # not a doc), but provably outside the build. Same skip the
            # docs-only path takes, and the same guarantee -- the check
            # runs stay present as `skipped`, so a required context is
            # satisfied rather than absent.
            echo "scope=merge-gate-only" >> "$GITHUB_OUTPUT"
            echo "scope_reason=no changed path can reach rustc: ${RUST_TOUCHED_REASON}" >> "$GITHUB_OUTPUT"
          elif [ "$docs_only" = "true" ]; then
            echo "scope=merge-gate-only" >> "$GITHUB_OUTPUT"
            echo "scope_reason=all changed paths are documentation or metadata" >> "$GITHUB_OUTPUT"
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "scope_reason=non-doc path: $non_doc_first" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan packaging impact
        if: github.actor != 'dependabot[bot]' && steps.credentials.outputs.has_credentials == 'true'
        id: packaging
        shell: bash
        env:
          PACKAGING_PATHS_POLICY: ${{ inputs.packaging_policy_path }}
          CHANGED_FILES: ${{ steps.files.outputs.changed_files }}
        run: |
          set -euo pipefail
          output="$(printf '%s\n' "$CHANGED_FILES" | .maxi-config/scripts/plan-packaging-impact.sh)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"

      # Fail closed onto the lane's NATIVE runner set rather than letting the
      # router fail: without this, the guards above turn "dependency PRs route
      # to a hardcoded lane" into "dependency PRs can never run any lane at
      # all", because every downstream lane is skipped behind a failed router.
      # Same trade the consumer-side dependabot fallbacks state.
      #
      # The value is not invented: it is the label set the routing policy
      # declares as the native self-hosted target for this workflow's default
      # lane, which is the one answer the resolver has for it. `inputs.lane` is
      # left at its default by rust-ci.yml's `plan` job, which passes only
      # `base_ref`.
      #
      # packaging_impact=false is the honest answer, not an optimistic one.
      # The packaging policy does count Cargo.lock and Cargo.toml, so a
      # Cargo bump WOULD have impact -- but the package lane is advisory on a
      # pull request (rust-ci.yml gates `should_run` on the ref as well), and
      # the merge to main re-runs this chain with an actor that is not
      # Dependabot, where the real policy is read and packaging is planned
      # properly. Nothing durable is skipped; only the PR-time preview is.
      - name: Use native lane for Dependabot
        if: ${{ github.actor == 'dependabot[bot]' }}
        id: dependabot-fallback
        run: |
          {
            echo 'runs-on=["self-hosted","Linux","X64"]'
            echo 'provider=self-hosted'
            echo 'packaging_impact=false'
            echo 'packaging_reason=dependabot: routing and packaging policy are unreadable without an app token; planned on merge to main instead'
            echo 'scope=full'
            echo 'scope_reason=dependabot: changed files are unreadable without an app token; conservatively full'
          } >> "$GITHUB_OUTPUT"

      # Same trade as the Dependabot fallback above, but for any other
      # credential-free caller (forks, external contributors, public-only
      # lanes) who did not forward APP_ID / APP_PRIVATE_KEY. We still need a
      # router answer so the downstream lanes are not skipped behind a
      # failed plan. The native runner set is the same one Dependabot's
      # fallback uses, and `packaging_impact=false` plus `scope=full` is the
      # honest answer when the private policy cannot be read. The merge to
      # main re-runs this chain with credentials, where the real policy is
      # applied.
      - name: Use native lane for credential-free caller
        if: github.actor != 'dependabot[bot]' && steps.credentials.outputs.has_credentials == 'false'
        id: credentials-fallback
        run: |
          {
            echo 'runs-on=["self-hosted","Linux","X64"]'
            echo 'provider=self-hosted'
            echo 'packaging_impact=false'
            echo 'packaging_reason=credential-free: routing and packaging policy are unreadable without an app token; planned on merge to main instead'
            echo 'scope=full'
            echo 'scope_reason=credential-free: changed files are unreadable without an app token; conservatively full'
          } >> "$GITHUB_OUTPUT"

      - name: Lane summary
        env:
          RUNNER_LABEL: ${{ steps.resolve.outputs.runs-on || steps.dependabot-fallback.outputs.runs-on || steps.credentials-fallback.outputs.runs-on }}
          PROVIDER: ${{ steps.resolve.outputs.provider || steps.dependabot-fallback.outputs.provider || steps.credentials-fallback.outputs.provider }}
          PACKAGING_IMPACT: ${{ steps.packaging.outputs.packaging_impact || steps.dependabot-fallback.outputs.packaging_impact || steps.credentials-fallback.outputs.packaging_impact }}
          PACKAGING_REASON: ${{ steps.packaging.outputs.packaging_reason || steps.dependabot-fallback.outputs.packaging_reason || steps.credentials-fallback.outputs.packaging_reason }}
          SCOPE: ${{ steps.scope.outputs.scope || steps.dependabot-fallback.outputs.scope || steps.credentials-fallback.outputs.scope }}
          SCOPE_REASON: ${{ steps.scope.outputs.scope_reason || steps.dependabot-fallback.outputs.scope_reason || steps.credentials-fallback.outputs.scope_reason }}
        run: |
          {
            echo "## lane-plan summary"
            echo "- Runner: $RUNNER_LABEL"
            echo "- Provider: $PROVIDER"
            echo "- Packaging impact: $PACKAGING_IMPACT"
            echo "- Packaging reason: $PACKAGING_REASON"
            echo "- Scope: $SCOPE"
            echo "- Scope reason: $SCOPE_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

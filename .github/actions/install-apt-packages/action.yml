name: Install repo-declared system packages
description: >
  Install the apt packages declared by a repository in ci/apt-packages.txt,
  one per line, with '#' comments allowed. An absent file means no extra
  packages; an empty (after-comment) list is the same. Runs on Linux only;
  exits 0 with a `::notice::` when the runner image does not provide
  apt-get (some self-hosted runners do not), and the same when the runner
  is not root and has no sudo (a non-sudoer build user cannot install).
  Then no-op on the assumption that the runner's image already covers the
  declared packages.

  This block previously existed as three near-identical copies -- in
  lane-check.yml, lane-test.yml and lane-package.yml. That is how a real
  bug came to be fixed in one copy alone, where it reached no consumer
  (#460, #461), and how #459-style divergence would have stayed hidden:
  nothing in the tree marked which copies were live. This action is the
  collapse (maxi-tools/maxi-config#174).

  Referenced by its full owner/repo path (maxi-tools/<repo>/...@main).
  `./.github/actions/...` would resolve against the CALLER's workspace,
  which in a consumer repo does not contain this action at all. The cost
  is that the calling lane runs the copy on main rather than the one
  under review -- a change here is exercised by vendored-action-drift's
  byte-identity mirror check and by main, not by the PR's lanes.
inputs:
  list-path:
    description: >
      Repo-relative path to the package list file. Defaults to
      ci/apt-packages.txt, the convention lane-check/lane-test/lane-package
      have always read.
    required: false
    default: ci/apt-packages.txt
runs:
  using: composite
  steps:
    - name: Install repo-declared system packages
      shell: bash
      run: |
        set -euo pipefail
        list="${{ inputs.list-path }}"
        [ -f "$list" ] || exit 0
        packages="$(sed -e 's/#.*//' -e 's/[[:space:]]*$//' "$list" | xargs)"
        [ -n "$packages" ] || exit 0

        # Not every self-hosted Linux runner is Debian-family with a sudoer
        # build user. Some run a declaratively-configured distribution with
        # neither apt-get nor sudo, taking system libraries from the machine's
        # own configuration instead -- so hard-coding `sudo apt-get` failed
        # every lane at provisioning with `sudo: command not found`, seconds
        # in, before compiling anything.
        if ! command -v apt-get >/dev/null 2>&1; then
          echo "::notice::No apt-get on this runner; expecting its image to provide: $packages"
          exit 0
        fi

        # Root needs no sudo, and a non-root user without it cannot install.
        # Saying so beats failing the lane over packages the image may
        # already have.
        elevate=()
        if [ "$(id -u)" -ne 0 ]; then
          if ! command -v sudo >/dev/null 2>&1; then
            echo "::warning::Cannot install system packages (not root, no sudo); expecting this runner's image to provide: $packages"
            exit 0
          fi
          elevate=(sudo)
        fi

        "${elevate[@]}" apt-get update
        # shellcheck disable=SC2086
        "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $packages